name: Cloudflare Paid Containers CI
on:
  push:
    branches:
      - design-engineer-cloudflare-deployment-05
      - design-engineer-subscriptions-minutes-razorpay-06
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            design-engineer-backend/package-lock.json
            design-engineer-plugin/package-lock.json
      - name: Check backend syntax
        run: node --check server.js && node --check services/billing.js
        working-directory: design-engineer-backend
      - name: Test Cloudflare routing and container configuration (no Cloudflare account required)
        run: node --test tests/*.test.js
        working-directory: cloudflare
      - name: Install Wrangler
        run: npm install
        working-directory: cloudflare
      - name: Build Cloudflare Container and Worker configuration (no deploy)
        run: npm run check:deploy
        working-directory: cloudflare
      - name: Backend dependency install
        run: npm ci
        working-directory: design-engineer-backend
      - name: Backend adapter tests
        run: node --test tests/*.test.js
        working-directory: design-engineer-backend
      - name: Plugin dependency install
        run: npm ci
        working-directory: design-engineer-plugin
      - name: Canvas selection regression tests
        run: node --test tests/canvas-selection.test.cjs
        working-directory: design-engineer-plugin
      - name: Plugin build
        run: npm run build
        working-directory: design-engineer-plugin
      - name: Install Chromium for role-based Figma UI tests
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
        working-directory: design-engineer-plugin
      - name: Build Figma browser test UI
        run: npm run build:preview
        working-directory: design-engineer-plugin
      - name: Test admin scorecard and normal-user preview in Chromium
        run: npm run test:e2e
        working-directory: design-engineer-plugin
      - name: Build marketing website and policy pages
        run: npm run build
        working-directory: website
